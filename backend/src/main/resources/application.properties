spring.application.name=fairshare

# In-memory H2 database (data is lost when the app stops).
# DB_CLOSE_DELAY=-1 keeps it alive even when all connections are closed for a moment
# (for example after the computer wakes up from sleep); without it H2 deletes the data.
spring.datasource.url=jdbc:h2:mem:fairshare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Don't keep the DB session open during view rendering (explicit transactions in services instead)
spring.jpa.open-in-view=false

# Flyway creates the tables (see db/migration); Hibernate only checks that they match the entities
spring.jpa.hibernate.ddl-auto=validate
