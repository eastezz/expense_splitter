# Settings for running with a real PostgreSQL database instead of H2.
# Turn them on with the environment variable SPRING_PROFILES_ACTIVE=postgres (Docker Compose will do this).
# Each value is read from an environment variable; the text after ":" is the default for local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fairshare}
spring.datasource.username=${DB_USER:fairshare}
spring.datasource.password=${DB_PASSWORD:fairshare}

# The H2 web console only works with H2, so it is switched off here
spring.h2.console.enabled=false
