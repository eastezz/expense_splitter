# Starts the app's services with Docker. Values like ${POSTGRES_PASSWORD:-fairshare} are read from
# the .env file next to this file; the text after ":-" is used when the value is missing.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fairshare}
      POSTGRES_USER: ${POSTGRES_USER:-fairshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairshare}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fairshare}
      DB_USER: ${POSTGRES_USER:-fairshare}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fairshare}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
