<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>expense_splitter: offline</title>
    <!-- Shown by the service worker when there is no internet and the app itself isn't saved yet.
         Everything is inside this one file, because without internet nothing else can be loaded. -->
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1f2328;
        background-color: #f6f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #e6edf3;
          background-color: #0d1117;
        }
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        text-align: center;
      }
      main {
        max-width: 22rem;
        padding: 1rem;
      }
      img {
        width: 4rem;
        height: 4rem;
        border-radius: 22%;
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.55rem 1.2rem;
        font-weight: 600;
        color: #ffffff;
        text-decoration: none;
        background-color: #1f6feb;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You are offline</h1>
      <p>expense_splitter needs an internet connection for this page. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
