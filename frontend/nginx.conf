# nginx settings for the frontend container: serve the built React app and forward /api to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # These requests go to the Spring Boot container ("backend" is the service name in compose.yaml):
    # /api/ (the REST API) and the two addresses of "Sign in with Google":
    # /oauth2/ (sends the browser to Google) and /login/oauth2/ (where Google sends it back).
    # The React page /login itself doesn't match and is still served below.
    location ~ ^/(api|oauth2|login/oauth2)/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port (localhost:3000); Spring builds Google's return address from it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages of the React app like /groups/1 are not real files.
    # If no file matches, send index.html and let React Router show the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page itself and the service worker must always be checked for a newer version
    # ("no-cache" = ask the server every time). Otherwise an old service worker could keep
    # showing an old version of the app after an update.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # The manifest with the content type that browsers expect, and also always fresh.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The JavaScript and CSS files from the build get a new name whenever their content changes,
    # so the browser may keep them for a year without asking again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
