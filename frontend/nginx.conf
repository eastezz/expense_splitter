# nginx settings for the frontend container: serve the built React app and forward /api to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every request that starts with /api/ goes to the Spring Boot container
    # ("backend" is the service name in compose.yaml, 8080 is its port).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages of the React app like /groups/1 are not real files.
    # If no file matches, send index.html and let React Router show the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
